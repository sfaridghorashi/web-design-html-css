<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farid Ghorashi | Web Design Projects</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 18px;
            color: #ddd;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .project {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .project h2 {
            margin-bottom: 15px;
        }

        .project p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .project a {
            display: inline-block;
            text-decoration: none;
            background: #222;
            color: white;
            padding: 12px 22px;
            border-radius: 6px;
        }

        .project a:hover {
            background: #444;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Farid Ghorashi</h1>
        <p>HTML & CSS Web Design Projects</p>
    </header>

    <main class="container">

        <div class="projects">

            <div class="project">
                <h2>Home Page</h2>

                <p>
                    My web design project created using HTML and CSS.
                </p>

                <a href="./Home%20Page/">
                    View Project
                </a>
            </div>

            <div class="project">
                <h2>Mini Project</h2>

                <p>
                    Another project developed while practicing HTML and CSS.
                </p>

                <a href="./Mini%20Project/">
                    View Project
                </a>
            </div>

        </div>

    </main>

    <footer>
        <p>© 2026 Farid Ghorashi</p>
    </footer>

</body>
</html>
